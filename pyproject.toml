[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyweft"
dynamic = ["version"]  # from __version__ in src/pyweft/__init__.py
description = "A UI framework for Python: XML templates, Python code-behind, one render core for web, desktop and mobile."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prassanth Nicholas" }]
dependencies = []
keywords = ["ui", "framework", "components", "pyodide", "webassembly", "webview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# `pyweft run --desktop`: the app in a native window. Optional, so the core
# stays dependency-free and web-only apps never install it.
desktop = ["pywebview>=5"]
# `pyweft build --desktop`: a standalone app to hand out. Needed only where
# the app is built, never by the people who run it.
package = ["pywebview>=5", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/prassanthn/PyWeft"
Documentation = "https://prassanthn.github.io/PyWeft/"
Issues = "https://github.com/prassanthn/PyWeft/issues"

[project.scripts]
pyweft = "pyweft.cli:main"

[tool.hatch.version]
path = "src/pyweft/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyweft"]

# The source archive: the package, its tests and docs, and nothing else
# lying around the repository (example apps, local test apps, the toolkit,
# which is released on its own).
[tool.hatch.build.targets.sdist]
# (A leading / anchors a pattern here; without it, "tests" would match
# packages/pyweft-ui/tests too.)
include = ["/src/pyweft", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/pyweft-ui/src"]
testpaths = ["tests", "packages/pyweft-ui/tests"]

# packages/pyweft-ui (the control toolkit) is developed here and released
# separately. uv installs it, editable, into this environment so `pyweft run`
# finds it and ships it to the browser; pip users: pip install -e packages/pyweft-ui
[tool.uv.workspace]
members = ["packages/pyweft-ui"]

[tool.uv.sources]
pyweft-ui = { workspace = true }

[dependency-groups]
dev = ["pyweft-ui"]
# The website (website/build.py): uv sync --group website
website = ["mkdocs-material>=9.8,<10; python_version >= '3.11'"]
