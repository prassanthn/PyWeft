[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyweft"
version = "0.0.1"
description = "A UI framework for Python: XML templates, Python code-behind, one render core for web, desktop and mobile."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prassanth Nicholas" }]
dependencies = []
keywords = ["ui", "framework", "components", "pyodide", "webassembly", "webview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/prassanthn/PyWeft"
Documentation = "https://github.com/prassanthn/PyWeft/blob/main/docs/getting-started.md"
Issues = "https://github.com/prassanthn/PyWeft/issues"

[project.scripts]
pyweft = "pyweft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyweft"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
