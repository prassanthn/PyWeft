[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyweft-ui"
dynamic = ["version"]  # from __version__ in src/pyweft_ui/__init__.py
description = "Ready-made controls for PyWeft: buttons, fields, cards, layout, dialogs. No HTML or CSS required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prassanth Nicholas" }]
# Below 1.0 a minor release may change things, so pin to the one this was
# tested with; raise it with each toolkit release.
dependencies = ["pyweft>=0.4,<0.5"]
keywords = ["ui", "components", "controls", "pyweft", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/prassanthn/PyWeft"
Documentation = "https://prassanthn.github.io/PyWeft/controls/"
Issues = "https://github.com/prassanthn/PyWeft/issues"

[tool.hatch.version]
path = "src/pyweft_ui/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/pyweft_ui", "/tests", "/docs", "/gallery", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
# The .weft files are the controls; hatchling ships every file in the package.
packages = ["src/pyweft_ui"]

[tool.uv.sources]
pyweft = { workspace = true }
